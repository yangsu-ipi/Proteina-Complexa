# AME (Motif + Ligand Binder) Evaluation Configuration
#
# Evaluates motif binder designs: binder refolding + motif RMSD/sequence recovery.
# motif_target_dict_cfg comes from generation config (via ame_generate)
# =============================================================================
# Evaluation mode
# =============================================================================
protein_type: motif_binder
input_mode: generated
dryrun: false
show_progress: false

metric:
  compute_motif_binder_metrics: true

  binder_folding_method: rf3_latest
  sequence_types: [self, mpnn_fixed]
  inverse_folding_model: ligand_mpnn

  ranking_criteria: null
  motif_ranking_criteria: null

  #esm metrics
  compute_esm_metrics: true
  # Sequence model: any HF masked-LM name for esm2, or an `esm` package
  # registry name for esmc (e.g. esmc_600m). esm_backend auto-detects from the
  # name; set it explicitly to override. esm_batch_tokens is the token budget
  # for one batched masked forward -- lower it if long sequences run out of
  # memory (the code also halves on OOM by itself).
  esm_model: facebook/esm2_t33_650M_UR50D
  # auto, esm2, esmc (transformers-format ESMC repo, e.g. biohub/ESMC-6B),
  # or esmc_pkg (the esm package's own ESMC -- currently cannot load)
  esm_backend: auto
  esm_batch_tokens: 16384
  # Reuse per-design ESM scores from esm_eval_cache.json. Keyed on
  # (esm_model, esm_backend, sequence), so a model switch recomputes.
  reuse_cached_esm: true
  # ---------------------------------------------------------------------------
  # Advisory second-opinion refolding (gates nothing)
  # ---------------------------------------------------------------------------
  # Fold the same complexes with another model and emit
  # {seq_type}_{backend}_{i_pAE,i_pTM,pTM,pLDDT} for comparison against the
  # primary backend above. Absolute cutoffs do not transfer between folding
  # models -- ESMFold2 runs on a compressed confidence scale -- so these are
  # diagnostic columns, not filters. Empty = off.
  consensus_backends: []      # e.g. [esmfold2]
  consensus_best_only: true   # score only the ranked-best sequence per type
  reuse_cached_consensus: true
  # backend settings. For esmfold2: num_loops, num_sampling_steps,
  # num_diffusion_samples (>1 folds N and keeps the best by i_pAE).
  # Note esmfold2 pLDDT is 0-1 and on a compressed scale vs AF2.
  #   Optional target MSA for advisory refolding. De novo binders have no
  #   meaningful alignment, so only the target may carry one -- the binder never
  #   does. Single-chain target: target_msa. Multi-chain: target_msa_paths, one
  #   entry per target chain (null where a chain has none). The alignment's query
  #   must equal that chain's sequence and its depth must be >= 2, both checked
  #   before folding. Cached scores key on MSA contents, so editing one in place
  #   invalidates them.
  #   e.g. consensus_cfg: {target_msa: /path/target.a3m, msa_max_sequences: 16384}
  consensus_cfg: {}
  # ---------------------------------------------------------------------------
  # Pre-refolding interface metrics (on generated structures)
  # ---------------------------------------------------------------------------
  compute_pre_refolding_metrics: false
  pre_refolding:
    bioinformatics: false  # Shape complementarity, SASA, hydrophobicity (requires sc/dssp binaries)
    tmol: false            # TMOL force field (H-bonds, electrostatics)

  # ---------------------------------------------------------------------------
  # Post-refolding interface metrics (on refolded structures)
  # ---------------------------------------------------------------------------
  compute_refolded_structure_metrics: false
  refolded:
    bioinformatics: false
    tmol: false

  # ---------------------------------------------------------------------------
  # Monomer metrics
  # ---------------------------------------------------------------------------
  compute_monomer_metrics: false
  # esmfold (facebook/esmfold_v1) or esmfold2 (single-chain, single-sequence,
  # Fast-Cutoff2025 checkpoint; override with ESMFOLD2_MONOMER_MODEL)
  monomer_folding_models: [esmfold]
  # Reuse a cached refold of a design when nothing determining it changed
  # (design, folding models + their checkpoints, num_seq, MPNN temperature).
  # scRMSD values are always cached; the folded structures only when
  # keep_folding_outputs is set, in which case adding an RMSD mode later
  # recomputes from them instead of refolding.
  reuse_cached_monomer_folds: true

  compute_designability: true
  designability_modes: [ca]

  compute_codesignability: true
  codesignability_modes: [ca, all_atom]

  keep_folding_outputs: true

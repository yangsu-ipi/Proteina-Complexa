# Indexed Monomer Motif Scaffolding — Evaluation
#
# Motif positions are known from the contig string. The evaluator uses
# contig-based indexing (unindexed=false) to align motif residues.
# Requires a motif_info CSV (auto-discovered next to samples).

defaults:
  - /design_tasks/motif_dict@dataset
  - _self_

# =============================================================================
# Evaluation mode
# =============================================================================
protein_type: monomer_motif
input_mode: generated
dryrun: false
show_progress: false

# =============================================================================
# Motif task configuration
# =============================================================================
dataset:
  motif_task_name: ${generation.task_name}
  unindexed: false

# =============================================================================
# Metric configuration
# =============================================================================
metric:
  compute_motif_metrics: true
  # esmfold (facebook/esmfold_v1) or esmfold2 (single-chain, single-sequence,
  # Fast-Cutoff2025 checkpoint; override with ESMFOLD2_MONOMER_MODEL)
  # Every folder this campaign refolds with. One list, every track: the complex,
  # the apo monomer, designability and codesignability. Each track gets the
  # members that can serve it -- af2 and esmfold2 fold both a monomer and a
  # complex, esmfold v1 only a monomer, rf3 only a complex -- and a member that
  # cannot serve a track is named in the run log rather than dropped in silence.
  #
  # Replaces monomer_folding_models, designability_folding_models,
  # codesignability_folding_models, apo_folding_models, consensus_backends and
  # binder_folding_method. Setting any of those alongside this one is refused:
  # two sources of truth for what refolded is not something precedence should
  # settle.
  #
  # The FIRST complex-capable member is the one the complex thresholds are
  # written against. Every other complex folder emits the same columns in its own
  # backend slot, and whether a criterion reads them is a threshold question.
  folding_models: [af2, esmfold2]

  # Reuse a cached refold of a design when nothing determining it changed
  # (design, folding models + their checkpoints, num_seq, MPNN temperature).
  # scRMSD values are always cached; the folded structures only when
  # keep_folding_outputs is set, in which case adding an RMSD mode later
  # recomputes from them instead of refolding.
  reuse_cached_monomer_folds: true

  motif_rmsd_modes: [ca, all_atom]
  designability_num_seq: 8
  designability_modes: [ca]
  codesignability_modes: [ca, all_atom]

  compute_ss: true
  compute_monomer_metrics: false
  compute_co_sequence_recovery: false
  compute_binder_metrics: false

  compute_novelty_pdb: false
  compute_novelty_afdb: false
  compute_novelty_afdb_rep_v4: false

  keep_folding_outputs: true
